# Packaging metadata so the backend has one source of truth for dependencies.
[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "welfair-ai-backend"
version = "0.1.0"
description = "Backend API for Welfair AI document triage and case management."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<1.0",
  "uvicorn[standard]>=0.44,<1.0",
  "pydantic-settings>=2.13,<3.0",
  "sqlmodel>=0.0.38,<1.0",
  "openai>=2.32,<3.0",
  "python-multipart>=0.0.26,<1.0",
  "pypdf>=6.10,<7.0",
  "pillow>=12.2,<13.0",
  "python-dotenv>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10.0",
  "httpx>=0.28,<1.0",
]

# Keep test discovery consistent for both teammates.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
